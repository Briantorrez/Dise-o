
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con sombras</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   

<h1>Crear cuenta</h1>

    <form class="formulario">


        <h1>Crear cuenta</h1>

         <div class="imagen-formulario">
    <img src="imagen.jpg" alt="Imagen del formulario">
</div>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">

        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="Escribe tu correo">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Escribe tu contraseña">

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" placeholder="Escribe un mensaje"></textarea>

        <button type="submit">Registrarme</button>


    </form>

</body>
</html>
